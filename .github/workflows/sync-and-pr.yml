name: Forge Core Sync & PR

on:
  push:
    branches: [main]
    paths:
      - 'hallatec.css'
      - 'hallatec.js'
      - 'tools.tsv'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hallatec-forge-core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate syntax
        run: node --check hallatec.js

      - name: Run cross-repo sync and open PRs
        env:
          GH_TOKEN: ${{ secrets.FORGE_SYNC_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.FORGE_SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/sync-and-pr.mjs
